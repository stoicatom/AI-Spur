<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AI-Spur Overlay</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        /* Hide the system cursor: the whip handle tracks the pointer and acts
           as the cursor while the overlay is up. */
        cursor: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="whip-canvas"></canvas>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
