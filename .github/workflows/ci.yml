name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch so a new push does not wait
# behind a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # TypeScript + Vitest
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend (typecheck + unit tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build frontend bundles
        run: pnpm exec vite build

  # --------------------------------------------------------------------------
  # Rust: clippy + tests + fmt
  # --------------------------------------------------------------------------
  rust:
    name: Rust (clippy + tests + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Tauri on Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            pkg-config \
            libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: rustfmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo tests
        working-directory: src-tauri
        run: cargo test

  # --------------------------------------------------------------------------
  # Tauri build verification (macOS only — matches the target platform)
  #
  # E2E tests (WebdriverIO + tauri-plugin-wdio-webdriver) are intentionally
  # excluded from CI: they require a real display and a connected Tauri app.
  # Run them locally with: npx wdio run wdio.conf.ts
  # --------------------------------------------------------------------------
  tauri-build:
    name: Tauri build (macOS)
    runs-on: macos-latest
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Vite bundles
        run: pnpm exec vite build

      - name: Build Tauri debug binary
        run: pnpm exec tauri build --debug

  # --------------------------------------------------------------------------
  # Windows: native target, capability diagnostics, and desktop smoke path.
  # A green macOS/Linux job cannot stand in for Windows foreground-process,
  # taskbar, UIPI, and SendInput behavior, so this job reports each boundary.
  # --------------------------------------------------------------------------
  windows:
    name: Windows (Rust + frontend + Tauri capability diagnostics)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable and Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Windows capability diagnostic
        shell: pwsh
        run: |
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Runner architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "WebView2 runtime:"; Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\*' -ErrorAction SilentlyContinue | Select-Object pv
          Write-Host "UIPI note: SendInput requires AISpur and the target terminal to run at compatible integrity levels."

      - name: Frontend typecheck and tests
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Rust format, clippy, tests, and Windows target check
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          cargo check --target x86_64-pc-windows-msvc --all-targets --all-features

      - name: Build Tauri debug binary for E2E
        run: pnpm exec tauri build --debug --no-bundle

      - name: Run Windows E2E when desktop binary is available
        shell: pwsh
        run: |
          $binary = Join-Path $PWD 'src-tauri\target\debug\AISpur.exe'
          if (Test-Path $binary) {
            Write-Host "Tauri binary found: $binary"
            pnpm test:e2e
          } else {
            Write-Warning "Tauri binary unavailable; E2E skipped. Native Rust/frontend checks above remain authoritative."
          }
