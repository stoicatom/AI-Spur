[package]
name = "openwhip"
version = "0.2.0"
description = "Whip Claude into shape"
authors = ["lorain"]
license = "MIT"
repository = "https://github.com/stoicatom/AI-Spur"
edition = "2024"
rust-version = "1.85.0"

[lib]
name = "openwhip"
crate-type = ["lib", "cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-global-shortcut = "2.3"
thiserror = "2.0"
dirs = "5.0"
enigo = "0.6"
