<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g_meteor_body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E7B50"/>
      <stop offset="0.5" stop-color="#6B5A2A"/>
      <stop offset="1" stop-color="#3D2F1A"/>
    </linearGradient>
    <linearGradient id="g_meteor_fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9500"/>
      <stop offset="0.5" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FF3B30"/>
    </linearGradient>
    <radialGradient id="g_heat" cx="0.6" cy="0.6">
      <stop offset="0" stop-color="#FFD60A"/>
      <stop offset="0.5" stop-color="#FF9500"/>
      <stop offset="1" stop-color="#FF3B30" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 尾迹粒子 - 最远 -->
  <circle cx="80" cy="150" r="12" fill="url(#g_meteor_fire)" opacity="0.2"/>
  <circle cx="120" cy="120" r="10" fill="url(#g_meteor_fire)" opacity="0.25"/>
  <circle cx="100" cy="180" r="8" fill="url(#g_meteor_fire)" opacity="0.2"/>

  <!-- 尾迹流 -->
  <path d="M64 128 Q160 200 320 320" stroke="url(#g_meteor_fire)" stroke-width="14"
        stroke-linecap="round" opacity="0.3" fill="none"/>
  <path d="M104 80 Q180 180 320 320" stroke="url(#g_meteor_fire)" stroke-width="10"
        stroke-linecap="round" opacity="0.25" fill="none"/>
  <path d="M32 192 Q160 260 320 320" stroke="url(#g_meteor_fire)" stroke-width="10"
        stroke-linecap="round" opacity="0.25" fill="none"/>

  <!-- 热辐射光晕 -->
  <circle cx="340" cy="340" r="100" fill="url(#g_heat)" opacity="0.4"/>

  <!-- 主体陨石 -->
  <circle cx="340" cy="340" r="80" fill="url(#g_meteor_body)" stroke="#2A2010" stroke-width="6"/>

  <!-- 陨石坑1 -->
  <circle cx="310" cy="310" r="18" fill="#2A2010" opacity="0.6"/>
  <circle cx="308" cy="308" r="12" fill="#1A1008" opacity="0.4"/>

  <!-- 陨石坑2 -->
  <circle cx="360" cy="325" r="14" fill="#2A2010" opacity="0.5"/>
  <circle cx="358" cy="323" r="9" fill="#1A1008" opacity="0.4"/>

  <!-- 陨石坑3 -->
  <circle cx="350" cy="370" r="12" fill="#2A2010" opacity="0.5"/>

  <!-- 热点 -->
  <circle cx="370" cy="350" r="28" fill="#FF6B35" opacity="0.6"/>
  <circle cx="370" cy="350" r="18" fill="#FF9500" opacity="0.7"/>
  <circle cx="370" cy="350" r="10" fill="#FFD60A" opacity="0.8"/>
</svg>
