<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g_lightning_main" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFF176"/>
      <stop offset="0.5" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="g_lightning_inner" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFEB3B"/>
      <stop offset="0.5" stop-color="#FFC107"/>
      <stop offset="1" stop-color="#FF6F00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 外发光 -->
  <path d="M280 32 L248 224 L360 224 L232 480 L264 288 L152 288 L280 32 Z"
        fill="#FFD54F" opacity="0.3" filter="url(#glow)"/>

  <!-- 主闪电 -->
  <path d="M280 32 L248 224 L360 224 L232 480 L264 288 L152 288 L280 32 Z"
        fill="url(#g_lightning_main)" stroke="#FF6F00" stroke-width="6" stroke-linejoin="bevel"/>

  <!-- 内部高光 -->
  <path d="M276 50 L252 210 L340 210 L242 450 L262 300 L170 300 L276 50 Z"
        fill="url(#g_lightning_inner)" opacity="0.7" stroke="none"/>

  <!-- 闪电裂纹细节 -->
  <path d="M300 140 L320 180 M340 260 L360 300 M250 350 L230 390"
        stroke="#FFEB3B" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
