<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g_flame_outer" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FF9500"/>
      <stop offset="0.5" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FF3B30"/>
    </linearGradient>
    <linearGradient id="g_flame_inner" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFD60A"/>
      <stop offset="0.5" stop-color="#FF9500"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="g_flame_core" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFACD"/>
      <stop offset="0.5" stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#FF9500"/>
    </linearGradient>
  </defs>

  <!-- 外层火焰 -->
  <path d="M256 80 C256 80 180 140 180 220 C180 280 210 340 256 360 C302 340 332 280 332 220 C332 140 256 80 256 80 Z"
        fill="url(#g_flame_outer)" stroke="none"/>

  <!-- 中层火焰 -->
  <path d="M256 100 C256 100 200 150 200 220 C200 270 220 320 256 340 C292 320 312 270 312 220 C312 150 256 100 256 100 Z"
        fill="url(#g_flame_inner)" opacity="0.9" stroke="none"/>

  <!-- 核心火焰 -->
  <path d="M256 120 C256 120 220 160 220 220 C220 260 235 300 256 315 C277 300 292 260 292 220 C292 160 256 120 256 120 Z"
        fill="url(#g_flame_core)" opacity="0.85" stroke="none"/>

  <!-- 左侧火舌 -->
  <path d="M200 180 C200 180 180 200 180 230 C180 250 190 270 210 280 C210 250 220 220 230 200"
        fill="url(#g_flame_outer)" opacity="0.6" stroke="none"/>

  <!-- 右侧火舌 -->
  <path d="M312 180 C312 180 332 200 332 230 C332 250 322 270 302 280 C302 250 292 220 282 200"
        fill="url(#g_flame_outer)" opacity="0.6" stroke="none"/>

  <!-- 顶部火星 -->
  <circle cx="240" cy="70" r="8" fill="#FFD60A" opacity="0.8"/>
  <circle cx="256" cy="55" r="10" fill="#FF9500" opacity="0.7"/>
  <circle cx="272" cy="65" r="7" fill="#FFD60A" opacity="0.8"/>

  <!-- 内部高光波纹 -->
  <path d="M240 160 C245 180 250 200 256 215 C262 200 267 180 272 160"
        fill="none" stroke="#FFFACD" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
</svg>
