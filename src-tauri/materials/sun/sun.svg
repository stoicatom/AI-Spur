<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 核心渐变（白→金→橙） -->
    <radialGradient id="g_sun_core" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#FFFACD"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="0.7" stop-color="#FFA500"/>
      <stop offset="1" stop-color="#FF8C00"/>
    </radialGradient>
    <!-- 表面纹理 -->
    <radialGradient id="g_sun_surface" cx="0.4" cy="0.4">
      <stop offset="0" stop-color="#FFEB3B"/>
      <stop offset="0.6" stop-color="#FFA726"/>
      <stop offset="1" stop-color="#FF6F00"/>
    </radialGradient>
    <!-- 日冕光芒 -->
    <radialGradient id="g_sun_corona" cx="0.5" cy="0.5">
      <stop offset="0.6" stop-color="#FFA500" stop-opacity="0.8"/>
      <stop offset="0.8" stop-color="#FF8C00" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FF6347" stop-opacity="0"/>
    </radialGradient>
    <!-- 发光效果 -->
    <filter id="glow_sun">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 耀斑模糊 -->
    <filter id="flare">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 外层光晕 -->
  <circle cx="256" cy="256" r="220" fill="url(#g_sun_corona)" opacity="0.6"/>

  <!-- 核心圆盘阴影 -->
  <circle cx="258" cy="258" r="120" fill="#000" opacity="0.2"/>

  <!-- 核心圆盘 -->
  <circle cx="256" cy="256" r="120" fill="url(#g_sun_core)" filter="url(#glow_sun)"/>

  <!-- 表面纹理层 -->
  <circle cx="256" cy="256" r="115" fill="url(#g_sun_surface)" opacity="0.7"/>

  <!-- 表面耀斑（不规则明亮区域） -->
  <ellipse cx="230" cy="230" rx="25" ry="20" fill="#FFEB3B" opacity="0.8" filter="url(#flare)"/>
  <ellipse cx="280" cy="250" rx="20" ry="25" fill="#FFD700" opacity="0.7" filter="url(#flare)"/>
  <ellipse cx="260" cy="290" rx="18" ry="15" fill="#FFFACD" opacity="0.6" filter="url(#flare)"/>

  <!-- 日冕细节纹理 -->
  <path d="M 200 256 Q 210 240 220 256" fill="none" stroke="#FF8C00" stroke-width="2" opacity="0.4"/>
  <path d="M 280 240 Q 290 230 300 240" fill="none" stroke="#FF8C00" stroke-width="2" opacity="0.4"/>
  <path d="M 240 300 Q 250 310 260 300" fill="none" stroke="#FF8C00" stroke-width="2" opacity="0.4"/>

  <!-- 不规则火焰光芒（12根，非直线） -->
  <g opacity="0.8">
    <!-- 上方光芒 -->
    <path d="M 256 136 Q 250 90 245 50 Q 248 40 256 45 Q 264 40 267 50 Q 262 90 256 136"
          fill="url(#g_sun_core)" filter="url(#glow_sun)"/>
    <!-- 右上 -->
    <path d="M 340 172 Q 380 140 410 115 Q 418 112 420 120 Q 418 128 410 125 Q 370 150 340 172"
          fill="url(#g_sun_core)" filter="url(#glow_sun)"/>
    <!-- 右 -->
    <path d="M 376 256 Q 420 250 460 245 Q 470 248 468 256 Q 470 264 460 267 Q 420 262 376 256"
          fill="url(#g_sun_core)" filter="url(#glow_sun)"/>
    <!-- 右下 -->
    <path d="M 340 340 Q 380 372 410 397 Q 418 400 420 392 Q 418 384 410 387 Q 370 362 340 340"
          fill="url(#g_sun_core)" filter="url(#glow_sun)"/>
    <!-- 下方 -->
    <path d="M 256 376 Q 262 422 267 462 Q 264 472 256 467 Q 248 472 245 462 Q 250 422 256 376"
          fill="url(#g_sun_core)" filter="url(#glow_sun)"/>
    <!-- 左下 -->
    <path d="M 172 340 Q 142 362 102 387 Q 94 384 92 392 Q 94 400 102 397 Q 132 372 172 340"
          fill="url(#g_sun_core)" filter="url(#glow_sun)"/>
    <!-- 左 -->
    <path d="M 136 256 Q 92 262 52 267 Q 42 264 44 256 Q 42 248 52 245 Q 92 250 136 256"
          fill="url(#g_sun_core)" filter="url(#glow_sun)"/>
    <!-- 左上 -->
    <path d="M 172 172 Q 142 150 102 125 Q 94 128 92 120 Q 94 112 102 115 Q 132 140 172 172"
          fill="url(#g_sun_core)" filter="url(#glow_sun)"/>
  </g>

  <!-- 次要光芒（8根，更短） -->
  <g opacity="0.5">
    <path d="M 316 166 Q 340 130 355 105 Q 360 102 362 108 Q 358 118 345 125 Q 325 145 316 166"
          fill="#FFD700" filter="url(#flare)"/>
    <path d="M 346 196 Q 380 180 405 170 Q 412 172 410 180 Q 405 188 395 185 Q 365 195 346 196"
          fill="#FFD700" filter="url(#flare)"/>
    <path d="M 346 316 Q 365 317 395 327 Q 405 324 410 332 Q 412 340 405 342 Q 380 332 346 316"
          fill="#FFD700" filter="url(#flare)"/>
    <path d="M 316 346 Q 325 367 345 387 Q 358 394 362 404 Q 360 410 355 407 Q 340 382 316 346"
          fill="#FFD700" filter="url(#flare)"/>
    <path d="M 196 346 Q 187 367 167 387 Q 154 394 150 404 Q 152 410 157 407 Q 172 382 196 346"
          fill="#FFD700" filter="url(#flare)"/>
    <path d="M 166 316 Q 147 317 117 327 Q 107 324 102 332 Q 100 340 107 342 Q 132 332 166 316"
          fill="#FFD700" filter="url(#flare)"/>
    <path d="M 166 196 Q 147 195 117 185 Q 107 188 102 180 Q 100 172 107 170 Q 132 180 166 196"
          fill="#FFD700" filter="url(#flare)"/>
    <path d="M 196 166 Q 187 145 167 125 Q 154 118 150 108 Q 152 102 157 105 Q 172 130 196 166"
          fill="#FFD700" filter="url(#flare)"/>
  </g>

  <!-- 中心高光 -->
  <ellipse cx="240" cy="240" rx="35" ry="30" fill="#FFFFFF" opacity="0.6" filter="url(#flare)"/>
  <circle cx="235" cy="235" r="15" fill="#FFFFFF" opacity="0.9"/>
</svg>
