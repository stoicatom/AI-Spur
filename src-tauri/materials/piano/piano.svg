<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 黑色琴身渐变 -->
    <linearGradient id="g_piano_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2C2C"/>
      <stop offset="0.5" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#0D0D0D"/>
    </linearGradient>
    <!-- 木质纹理 -->
    <linearGradient id="g_wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E342E"/>
      <stop offset="0.5" stop-color="#3E2723"/>
      <stop offset="1" stop-color="#2E1A14"/>
    </linearGradient>
    <!-- 金属踏板 -->
    <linearGradient id="g_pedal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <!-- 阴影 -->
    <filter id="shadow_piano">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 琴身主体（立式钢琴侧视） -->
  <rect x="140" y="120" width="240" height="280" rx="8"
        fill="url(#g_piano_body)" stroke="#000" stroke-width="4"
        filter="url(#shadow_piano)"/>

  <!-- 琴身木纹装饰 -->
  <rect x="145" y="125" width="230" height="270" rx="6"
        fill="url(#g_wood)" opacity="0.3"/>

  <!-- 琴盖（半开状态） -->
  <path d="M 150 120 L 370 100 L 370 130 L 150 150 Z"
        fill="url(#g_piano_body)" stroke="#000" stroke-width="3"
        filter="url(#shadow_piano)"/>

  <!-- 琴盖边缘高光 -->
  <line x1="150" y1="125" x2="370" y2="105" stroke="#4A4A4A" stroke-width="2"/>

  <!-- 琴弦暗示（内部可见） -->
  <g opacity="0.5">
    <line x1="170" y1="140" x2="170" y2="180" stroke="#8B7355" stroke-width="1"/>
    <line x1="180" y1="140" x2="180" y2="180" stroke="#8B7355" stroke-width="1"/>
    <line x1="190" y1="140" x2="190" y2="180" stroke="#8B7355" stroke-width="1"/>
    <line x1="200" y1="140" x2="200" y2="180" stroke="#8B7355" stroke-width="1"/>
    <line x1="320" y1="135" x2="320" y2="175" stroke="#8B7355" stroke-width="1"/>
    <line x1="330" y1="135" x2="330" y2="175" stroke="#8B7355" stroke-width="1"/>
    <line x1="340" y1="135" x2="340" y2="175" stroke="#8B7355" stroke-width="1"/>
    <line x1="350" y1="135" x2="350" y2="175" stroke="#8B7355" stroke-width="1"/>
  </g>

  <!-- 琴键区域背景 -->
  <rect x="155" y="200" width="210" height="120" rx="4"
        fill="#1A1A1A" stroke="#000" stroke-width="2"/>

  <!-- 白键（7个八度示意） -->
  <g>
    <rect x="165" y="210" width="18" height="100" rx="2" fill="#FAFAFA" stroke="#CCC" stroke-width="1"/>
    <rect x="188" y="210" width="18" height="100" rx="2" fill="#FAFAFA" stroke="#CCC" stroke-width="1"/>
    <rect x="211" y="210" width="18" height="100" rx="2" fill="#FAFAFA" stroke="#CCC" stroke-width="1"/>
    <rect x="234" y="210" width="18" height="100" rx="2" fill="#FAFAFA" stroke="#CCC" stroke-width="1"/>
    <rect x="257" y="210" width="18" height="100" rx="2" fill="#FAFAFA" stroke="#CCC" stroke-width="1"/>
    <rect x="280" y="210" width="18" height="100" rx="2" fill="#FAFAFA" stroke="#CCC" stroke-width="1"/>
    <rect x="303" y="210" width="18" height="100" rx="2" fill="#FAFAFA" stroke="#CCC" stroke-width="1"/>
    <rect x="326" y="210" width="18" height="100" rx="2" fill="#FAFAFA" stroke="#CCC" stroke-width="1"/>
  </g>

  <!-- 黑键（5个） -->
  <g>
    <rect x="178" y="210" width="12" height="65" rx="2" fill="#0D0D0D" stroke="#000" stroke-width="1"/>
    <rect x="201" y="210" width="12" height="65" rx="2" fill="#0D0D0D" stroke="#000" stroke-width="1"/>
    <rect x="247" y="210" width="12" height="65" rx="2" fill="#0D0D0D" stroke="#000" stroke-width="1"/>
    <rect x="270" y="210" width="12" height="65" rx="2" fill="#0D0D0D" stroke="#000" stroke-width="1"/>
    <rect x="293" y="210" width="12" height="65" rx="2" fill="#0D0D0D" stroke="#000" stroke-width="1"/>
  </g>

  <!-- 琴键架（下方木质部分） -->
  <rect x="155" y="320" width="210" height="20"
        fill="url(#g_wood)" stroke="#3E2723" stroke-width="2"/>

  <!-- 琴腿（3条） -->
  <rect x="160" y="400" width="20" height="60" rx="4"
        fill="url(#g_wood)" stroke="#2E1A14" stroke-width="2"
        filter="url(#shadow_piano)"/>
  <rect x="250" y="400" width="20" height="60" rx="4"
        fill="url(#g_wood)" stroke="#2E1A14" stroke-width="2"
        filter="url(#shadow_piano)"/>
  <rect x="340" y="400" width="20" height="60" rx="4"
        fill="url(#g_wood)" stroke="#2E1A14" stroke-width="2"
        filter="url(#shadow_piano)"/>

  <!-- 踏板（3个金色踏板） -->
  <g>
    <ellipse cx="180" cy="475" rx="12" ry="6"
             fill="url(#g_pedal)" stroke="#B8860B" stroke-width="2"/>
    <ellipse cx="260" cy="475" rx="12" ry="6"
             fill="url(#g_pedal)" stroke="#B8860B" stroke-width="2"/>
    <ellipse cx="340" cy="475" rx="12" ry="6"
             fill="url(#g_pedal)" stroke="#B8860B" stroke-width="2"/>
  </g>

  <!-- 踏板杆 -->
  <line x1="180" y1="469" x2="180" y2="460" stroke="#B8860B" stroke-width="3"/>
  <line x1="260" y1="469" x2="260" y2="460" stroke="#B8860B" stroke-width="3"/>
  <line x1="340" y1="469" x2="340" y2="460" stroke="#B8860B" stroke-width="3"/>

  <!-- 品牌标识位置（装饰线） -->
  <path d="M 200 160 Q 256 155 312 160" fill="none" stroke="#8B7355" stroke-width="2" opacity="0.6"/>

  <!-- 琴身装饰线 -->
  <line x1="145" y1="200" x2="375" y2="200" stroke="#4A4A4A" stroke-width="1" opacity="0.5"/>
  <line x1="145" y1="340" x2="365" y2="340" stroke="#4A4A4A" stroke-width="1" opacity="0.5"/>

  <!-- 音板共鸣孔暗示 -->
  <ellipse cx="256" cy="360" rx="40" ry="15" fill="none" stroke="#3E2723" stroke-width="2" opacity="0.4"/>
</svg>
