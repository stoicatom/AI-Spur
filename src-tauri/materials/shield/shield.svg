<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g_shield_main" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#4A90E2"/>
      <stop offset="0.4" stop-color="#007AFF"/>
      <stop offset="0.6" stop-color="#0051D5"/>
      <stop offset="1" stop-color="#003DA5"/>
    </linearGradient>
    <linearGradient id="g_shield_rim" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#C0C0C0"/>
      <stop offset="0.5" stop-color="#A0A0A0"/>
      <stop offset="1" stop-color="#808080"/>
    </linearGradient>
  </defs>

  <!-- 盾牌阴影 -->
  <path d="M258 50 L98 114 L98 266 C98 350 170 422 258 458 C346 422 418 350 418 266 L418 114 Z"
        fill="#000" opacity="0.2"/>

  <!-- 盾牌金属边框 -->
  <path d="M256 48 L96 112 L96 264 C96 348 168 420 256 456 C344 420 416 348 416 264 L416 112 Z"
        fill="url(#g_shield_rim)" stroke="#707070" stroke-width="8"/>

  <!-- 盾牌主体 -->
  <path d="M256 64 L112 120 L112 264 C112 338 176 404 256 436 C336 404 400 338 400 264 L400 120 Z"
        fill="url(#g_shield_main)" stroke="#0051D5" stroke-width="6"/>

  <!-- 中央分隔线 -->
  <line x1="256" y1="80" x2="256" y2="420" stroke="#0040AA" stroke-width="8" opacity="0.3"/>

  <!-- 铆钉装饰 -->
  <circle cx="160" cy="160" r="8" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>
  <circle cx="352" cy="160" r="8" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>
  <circle cx="140" cy="260" r="8" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>
  <circle cx="372" cy="260" r="8" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>
  <circle cx="200" cy="360" r="8" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>
  <circle cx="312" cy="360" r="8" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>

  <!-- 纹章图案 - 十字 -->
  <path d="M256 180 L256 320" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity="0.9"/>
  <path d="M196 250 L316 250" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity="0.9"/>

  <!-- 边缘高光 -->
  <path d="M130 130 C140 125 200 100 256 80 C312 100 372 125 382 130"
        fill="none" stroke="#87CEEB" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
</svg>
