<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 事件视界渐变（深色主题） -->
    <radialGradient id="g_horizon" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.6" stop-color="#0A0A0A"/>
      <stop offset="0.8" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#2A2A2A"/>
    </radialGradient>
    <!-- 吸积盘渐变（深橙到深红） -->
    <linearGradient id="g_disk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A1A00"/>
      <stop offset="0.3" stop-color="#6A2A00"/>
      <stop offset="0.6" stop-color="#8A3A00"/>
      <stop offset="1" stop-color="#AA4A00"/>
    </linearGradient>
    <!-- 霍金辐射（暗紫色） -->
    <radialGradient id="g_radiation" cx="0.5" cy="0.5">
      <stop offset="0.7" stop-color="#1A0A2A" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#2A1A3A" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3A2A4A" stop-opacity="0.6"/>
    </radialGradient>
    <!-- 发光效果 -->
    <filter id="glow_dark">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 外层霍金辐射 -->
  <circle cx="256" cy="256" r="180" fill="url(#g_radiation)" opacity="0.5"/>

  <!-- 吸积盘（旋涡结构 - 深色调） -->
  <g opacity="0.9">
    <!-- 外层盘环 -->
    <ellipse cx="256" cy="256" rx="150" ry="35"
             fill="none" stroke="url(#g_disk)" stroke-width="10"
             opacity="0.7" filter="url(#glow_dark)"/>
    <ellipse cx="256" cy="256" rx="130" ry="30"
             fill="none" stroke="url(#g_disk)" stroke-width="12"
             opacity="0.8" filter="url(#glow_dark)"/>
    <ellipse cx="256" cy="256" rx="110" ry="25"
             fill="none" stroke="url(#g_disk)" stroke-width="14"
             opacity="0.9" filter="url(#glow_dark)"/>
  </g>

  <!-- 旋涡臂（深色） -->
  <g opacity="0.6">
    <path d="M 256 256 Q 310 245 340 256 Q 355 265 340 275 Q 310 285 256 275"
          fill="none" stroke="#6A2A00" stroke-width="6"
          filter="url(#glow_dark)"/>
    <path d="M 256 256 Q 202 245 172 256 Q 157 265 172 275 Q 202 285 256 275"
          fill="none" stroke="#6A2A00" stroke-width="6"
          filter="url(#glow_dark)"/>
  </g>

  <!-- 事件视界（深黑色环） -->
  <circle cx="256" cy="256" r="80"
          fill="url(#g_horizon)" stroke="#2A2A2A" stroke-width="3"
          filter="url(#glow_dark)"/>

  <!-- 事件视界纹理 -->
  <g opacity="0.3">
    <circle cx="256" cy="256" r="75" fill="none" stroke="#3A3A3A" stroke-width="1"/>
    <circle cx="256" cy="256" r="68" fill="none" stroke="#3A3A3A" stroke-width="1"/>
    <circle cx="256" cy="256" r="60" fill="none" stroke="#3A3A3A" stroke-width="1"/>
  </g>

  <!-- 中心奇点（纯黑，带微弱边缘） -->
  <circle cx="256" cy="256" r="35" fill="#000000" stroke="#1A1A1A" stroke-width="2"
          filter="url(#glow_dark)"/>

  <!-- 引力透镜效果（暗色光环） -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#3A2A4A" stroke-width="2"
          opacity="0.4" stroke-dasharray="8 4"/>

  <!-- 相对论喷流（上下深色喷流） -->
  <g opacity="0.7">
    <!-- 上方喷流 -->
    <path d="M 256 176 Q 252 130 248 90 Q 250 82 256 85 Q 262 82 264 90 Q 260 130 256 176"
          fill="#2A1A3A" opacity="0.6" filter="url(#glow_dark)"/>
    <path d="M 256 176 Q 254 145 253 115 Q 254 110 256 112 Q 258 110 259 115 Q 258 145 256 176"
          fill="#3A2A4A" opacity="0.8" filter="url(#glow_dark)"/>

    <!-- 下方喷流 -->
    <path d="M 256 336 Q 260 382 264 422 Q 262 430 256 427 Q 250 430 248 422 Q 252 382 256 336"
          fill="#2A1A3A" opacity="0.6" filter="url(#glow_dark)"/>
    <path d="M 256 336 Q 258 367 259 397 Q 258 402 256 400 Q 254 402 253 397 Q 254 367 256 336"
          fill="#3A2A4A" opacity="0.8" filter="url(#glow_dark)"/>
  </g>

  <!-- 吸积盘亮点（暗橙色粒子） -->
  <g opacity="0.6">
    <circle cx="330" cy="250" r="4" fill="#AA4A00"/>
    <circle cx="300" cy="270" r="3" fill="#8A3A00"/>
    <circle cx="210" cy="265" r="3" fill="#8A3A00"/>
    <circle cx="180" cy="250" r="4" fill="#AA4A00"/>
    <circle cx="260" cy="230" r="3" fill="#6A2A00"/>
    <circle cx="250" cy="280" r="3" fill="#6A2A00"/>
  </g>

  <!-- 空间扭曲暗示线（极暗） -->
  <g opacity="0.2">
    <path d="M 120 220 Q 190 215 256 220 Q 322 225 392 220" fill="none" stroke="#2A2A2A" stroke-width="1"/>
    <path d="M 120 256 Q 190 251 256 256 Q 322 261 392 256" fill="none" stroke="#2A2A2A" stroke-width="1"/>
    <path d="M 120 292 Q 190 297 256 292 Q 322 287 392 292" fill="none" stroke="#2A2A2A" stroke-width="1"/>
  </g>

  <!-- 霍金辐射光点（暗紫色） -->
  <g opacity="0.5">
    <circle cx="316" cy="196" r="2" fill="#3A2A4A"/>
    <circle cx="196" cy="196" r="2" fill="#3A2A4A"/>
    <circle cx="316" cy="316" r="2" fill="#3A2A4A"/>
    <circle cx="196" cy="316" r="2" fill="#3A2A4A"/>
  </g>
</svg>
