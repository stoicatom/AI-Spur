<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g_bomb_body" x1="0.3" y1="0.3" x2="0.7" y2="0.7">
      <stop offset="0" stop-color="#3A3A3A"/>
      <stop offset="0.4" stop-color="#2C2C2E"/>
      <stop offset="0.6" stop-color="#1C1C1E"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="g_fuse" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#4A4A4A"/>
      <stop offset="1" stop-color="#2A2A2A"/>
    </linearGradient>
    <radialGradient id="g_shine" cx="0.35" cy="0.35">
      <stop offset="0" stop-color="#8E8E93" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3A3A3A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 炸弹阴影 -->
  <circle cx="250" cy="306" r="170" fill="#000" opacity="0.2"/>

  <!-- 炸弹主体 -->
  <circle cx="248" cy="304" r="168" fill="url(#g_bomb_body)" stroke="#0A0A0A" stroke-width="8"/>

  <!-- 金属光泽 -->
  <circle cx="196" cy="252" r="60" fill="url(#g_shine)"/>
  <ellipse cx="200" cy="260" rx="40" ry="50" fill="#636366" opacity="0.15"/>

  <!-- 导火线路径 -->
  <path d="M340 160 Q360 140 380 120 Q400 100 420 80"
        stroke="url(#g_fuse)" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- 导火线编织纹理 -->
  <path d="M345 158 Q365 138 385 118" stroke="#6B6B70" stroke-width="4" opacity="0.6" fill="none"/>
  <path d="M335 162 Q355 142 375 122" stroke="#1C1C1E" stroke-width="4" opacity="0.4" fill="none"/>

  <!-- 引信接口 -->
  <circle cx="340" cy="160" r="20" fill="#4A4A4A" stroke="#2A2A2A" stroke-width="4"/>
  <circle cx="340" cy="160" r="12" fill="#2C2C2E"/>

  <!-- 火花粒子 -->
  <circle cx="395" cy="105" r="6" fill="#FFD60A" opacity="0.9"/>
  <circle cx="405" cy="95" r="5" fill="#FF9500" opacity="0.8"/>
  <circle cx="410" cy="85" r="4" fill="#FFD60A" opacity="0.7"/>

  <!-- 火焰核心 -->
  <circle cx="420" cy="80" r="24" fill="#FF9500" opacity="0.6"/>
  <circle cx="420" cy="80" r="16" fill="#FFD60A" opacity="0.8"/>
  <circle cx="420" cy="80" r="8" fill="#FFFACD"/>

  <!-- 火焰光晕 -->
  <circle cx="420" cy="80" r="36" fill="#FF6B35" opacity="0.2"/>

  <!-- 火焰跳动粒子 -->
  <circle cx="410" cy="60" r="5" fill="#FF9500" opacity="0.6"/>
  <circle cx="430" cy="65" r="4" fill="#FFD60A" opacity="0.7"/>
  <circle cx="425" cy="50" r="3" fill="#FF6B35" opacity="0.5"/>
</svg>
