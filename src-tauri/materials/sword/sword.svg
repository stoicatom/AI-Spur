<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g_blade" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#E8E8E8"/>
      <stop offset="0.4" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#C0C0C0"/>
      <stop offset="1" stop-color="#A0A0A0"/>
    </linearGradient>
    <linearGradient id="g_hilt" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#8B4513"/>
      <stop offset="0.5" stop-color="#6B3410"/>
      <stop offset="1" stop-color="#4A2408"/>
    </linearGradient>
    <radialGradient id="g_gem" cx="0.4" cy="0.3">
      <stop offset="0" stop-color="#FF6B9D"/>
      <stop offset="0.6" stop-color="#C2185B"/>
      <stop offset="1" stop-color="#880E4F"/>
    </radialGradient>
  </defs>

  <!-- 剑刃阴影 -->
  <path d="M258 48 L242 322" stroke="#000" stroke-width="28" opacity="0.1" stroke-linecap="round"/>

  <!-- 剑刃主体 -->
  <path d="M256 48 L240 320" stroke="url(#g_blade)" stroke-width="26" stroke-linecap="round"/>
  <path d="M256 48 L272 320" stroke="url(#g_blade)" stroke-width="26" stroke-linecap="round"/>

  <!-- 剑刃中线（血槽） -->
  <line x1="256" y1="60" x2="256" y2="310" stroke="#A0A0A0" stroke-width="6" opacity="0.4"/>

  <!-- 剑尖 -->
  <path d="M240 48 L256 28 L272 48" fill="url(#g_blade)" stroke="#A0A0A0" stroke-width="4"/>

  <!-- 护手基座 -->
  <rect x="232" y="314" width="48" height="16" rx="8" fill="#DAA520" stroke="#B8860B" stroke-width="4"/>

  <!-- 护手横条 -->
  <rect x="180" y="318" width="152" height="8" rx="4" fill="#FFD700" stroke="#DAA520" stroke-width="4"/>
  <circle cx="180" cy="322" r="12" fill="#DAA520" stroke="#B8860B" stroke-width="3"/>
  <circle cx="332" cy="322" r="12" fill="#DAA520" stroke="#B8860B" stroke-width="3"/>

  <!-- 剑柄 -->
  <rect x="240" y="330" width="32" height="90" rx="16" fill="url(#g_hilt)" stroke="#4A2408" stroke-width="4"/>

  <!-- 剑柄缠绕纹理 -->
  <line x1="240" y1="350" x2="272" y2="350" stroke="#8B6914" stroke-width="2"/>
  <line x1="240" y1="370" x2="272" y2="370" stroke="#8B6914" stroke-width="2"/>
  <line x1="240" y1="390" x2="272" y2="390" stroke="#8B6914" stroke-width="2"/>
  <line x1="240" y1="410" x2="272" y2="410" stroke="#8B6914" stroke-width="2"/>

  <!-- 剑首 -->
  <circle cx="256" cy="440" r="28" fill="#DAA520" stroke="#B8860B" stroke-width="5"/>
  <circle cx="256" cy="440" r="16" fill="url(#g_gem)" stroke="#880E4F" stroke-width="3"/>
  <circle cx="252" cy="436" r="6" fill="#FFB3D9" opacity="0.6"/>
</svg>
