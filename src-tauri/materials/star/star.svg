<svg xmlns="http://www.w3.org/2000/512 512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g_star_main" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFE55C"/>
      <stop offset="0.5" stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#FF9500"/>
    </linearGradient>
    <linearGradient id="g_star_shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFACD"/>
      <stop offset="1" stop-color="#FFD60A"/>
    </linearGradient>
    <radialGradient id="g_glow" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#FFD60A" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FF9500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 外发光 -->
  <circle cx="256" cy="256" r="160" fill="url(#g_glow)"/>

  <!-- 星星阴影 -->
  <path d="M258 50 L298 182 L434 182 C440 182 443 190 438 194 L328 274 L368 406 C370 412 363 416 358 412 L258 332 L158 412 C153 416 146 412 148 406 L188 274 L78 194 C73 190 76 182 82 182 L218 182 Z"
        fill="#000" opacity="0.15" transform="translate(3, 3)"/>

  <!-- 星星主体 -->
  <path d="M256 48 L296 180 L432 180 C438 180 441 188 436 192 L326 272 L366 404 C368 410 361 414 356 410 L256 330 L156 410 C151 414 144 410 146 404 L186 272 L76 192 C71 188 74 180 80 180 L216 180 Z"
        fill="url(#g_star_main)" stroke="#FF8C00" stroke-width="6"/>

  <!-- 内部高光 -->
  <path d="M256 80 L286 180 L366 180 L306 230 L336 330 L256 270 L176 330 L206 230 L146 180 L226 180 Z"
        fill="url(#g_star_shine)" opacity="0.6" stroke="none"/>

  <!-- 星星纹理线条 -->
  <line x1="256" y1="100" x2="256" y2="160" stroke="#FFFACD" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <line x1="326" y1="210" x2="366" y2="240" stroke="#FFFACD" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <line x1="346" y1="330" x2="306" y2="300" stroke="#FFFACD" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <line x1="206" y1="300" x2="166" y2="330" stroke="#FFFACD" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <line x1="146" y1="210" x2="186" y2="240" stroke="#FFFACD" stroke-width="3" opacity="0.5" stroke-linecap="round"/>

  <!-- 中心宝石 -->
  <circle cx="256" cy="240" r="24" fill="#FFFACD" stroke="#FFE55C" stroke-width="4"/>
  <circle cx="250" cy="234" r="10" fill="#FFF" opacity="0.6"/>
