<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 木柄渐变 -->
    <linearGradient id="g_axe_handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B4513"/>
      <stop offset="0.5" stop-color="#A0522D"/>
      <stop offset="1" stop-color="#6B3410"/>
    </linearGradient>
    <!-- 斧刃渐变 -->
    <linearGradient id="g_axe_blade" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#B0BEC5"/>
      <stop offset="0.3" stop-color="#ECEFF1"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#CFD8DC"/>
      <stop offset="1" stop-color="#90A4AE"/>
    </linearGradient>
    <!-- 金属高光 -->
    <linearGradient id="g_axe_shine" x1="0.3" y1="0.3" x2="0.7" y2="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 阴影 -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 木柄主体 -->
  <path d="M 160 140 Q 200 200 240 260 Q 280 320 320 380 Q 340 410 360 440"
        stroke="url(#g_axe_handle)"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        filter="url(#shadow)"/>

  <!-- 木柄纹理细节 -->
  <path d="M 165 150 Q 205 210 245 270"
        stroke="#A0522D"
        stroke-width="4"
        opacity="0.4"
        stroke-linecap="round"
        fill="none"/>
  <path d="M 250 270 Q 290 330 330 390"
        stroke="#6B3410"
        stroke-width="4"
        opacity="0.3"
        stroke-linecap="round"
        fill="none"/>

  <!-- 皮革缠绕带 -->
  <ellipse cx="200" cy="180" rx="18" ry="8"
           fill="#654321"
           opacity="0.7"
           transform="rotate(-40 200 180)"/>
  <ellipse cx="220" cy="220" rx="18" ry="8"
           fill="#654321"
           opacity="0.7"
           transform="rotate(-40 220 220)"/>
  <ellipse cx="280" cy="340" rx="18" ry="8"
           fill="#654321"
           opacity="0.7"
           transform="rotate(-40 280 340)"/>

  <!-- 斧刃阴影 -->
  <path d="M 140 80 C 100 60 60 70 50 110 C 40 150 60 200 100 240 C 140 280 200 300 250 280 L 280 240 L 240 160 L 200 120 Z"
        fill="#000000"
        opacity="0.15"
        transform="translate(3, 3)"/>

  <!-- 斧刃主体（双刃维京风格） -->
  <path d="M 140 80 C 100 60 60 70 50 110 C 40 150 60 200 100 240 C 140 280 200 300 250 280 L 280 240 L 240 160 L 200 120 Z"
        fill="url(#g_axe_blade)"
        stroke="#607D8B"
        stroke-width="6"
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- 刃口锋利边缘 -->
  <path d="M 50 110 C 48 130 52 160 70 190 C 88 220 110 240 130 252"
        stroke="#FFFFFF"
        stroke-width="3"
        opacity="0.8"
        stroke-linecap="round"
        fill="none"/>

  <!-- 金属高光 -->
  <ellipse cx="140" cy="160" rx="50" ry="70"
           fill="url(#g_axe_shine)"
           transform="rotate(-30 140 160)"/>

  <!-- 战损刻痕 -->
  <line x1="110" y1="130" x2="90" y2="150"
        stroke="#546E7A"
        stroke-width="3"
        opacity="0.6"
        stroke-linecap="round"/>
  <line x1="140" y1="200" x2="120" y2="220"
        stroke="#546E7A"
        stroke-width="2.5"
        opacity="0.5"
        stroke-linecap="round"/>
  <line x1="170" y1="240" x2="150" y2="260"
        stroke="#546E7A"
        stroke-width="2"
        opacity="0.4"
        stroke-linecap="round"/>

  <!-- 下刃细节 -->
  <path d="M 200 120 L 280 240 L 250 280 C 210 295 160 280 130 252"
        fill="none"
        stroke="#78909C"
        stroke-width="4"
        opacity="0.3"/>

  <!-- 铆钉连接 -->
  <circle cx="220" cy="140" r="8"
          fill="#455A64"
          stroke="#263238"
          stroke-width="2"/>
  <circle cx="260" cy="220" r="8"
          fill="#455A64"
          stroke="#263238"
          stroke-width="2"/>

  <!-- 铆钉高光 -->
  <circle cx="218" cy="138" r="3"
          fill="#90A4AE"
          opacity="0.8"/>
  <circle cx="258" cy="218" r="3"
          fill="#90A4AE"
          opacity="0.8"/>
</svg>
