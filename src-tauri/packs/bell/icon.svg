<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <title>黄铜铃铛</title>
  <defs>
    <linearGradient id="bell-shell" x1="14" y1="9" x2="34" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--pack-brass-light,#D7CFB2)"/>
      <stop offset=".46" stop-color="var(--pack-brass,#A98B50)"/>
      <stop offset="1" stop-color="var(--pack-brass-shadow,#665943)"/>
    </linearGradient>
    <linearGradient id="bell-rim" x1="11" y1="33" x2="37" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--pack-rim-light,#C1B18A)"/>
      <stop offset="1" stop-color="var(--pack-rim-shadow,#7A6747)"/>
    </linearGradient>
    <filter id="studio-light" x="-28%" y="-24%" width="156%" height="168%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.15" result="shadow-blur"/>
      <feOffset in="shadow-blur" dy="1.65" result="shadow-offset"/>
      <feFlood flood-color="#02070A" flood-opacity=".52" result="shadow-color"/>
      <feComposite in="shadow-color" in2="shadow-offset" operator="in" result="shadow"/>
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="13" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values=".12 0 0 0 .44  0 .12 0 0 .46  0 0 .12 0 .48  0 0 0 .14 0" result="micro-texture"/>
      <feComposite in="micro-texture" in2="SourceAlpha" operator="in" result="surface"/>
      <feSpecularLighting in="SourceAlpha" surfaceScale="2.2" specularConstant=".42" specularExponent="26" lighting-color="#FFFFFF" result="specular">
        <feDistantLight azimuth="224" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="highlight"/>
      <feBlend in="SourceGraphic" in2="surface" mode="soft-light" result="textured"/>
      <feBlend in="textured" in2="highlight" mode="screen" result="lit"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="lit"/></feMerge>
    </filter>
    <filter id="contact-shadow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="1.45"/>
    </filter>
  </defs>
  <ellipse cx="24" cy="42.25" rx="12.5" ry="1.35" fill="#02070A" opacity=".38" filter="url(#contact-shadow)"/>
  <g filter="url(#studio-light)">
  <path d="M20 10V8c0-3 2-5 4-5s4 2 4 5v2" stroke="var(--pack-edge,#5F584A)" stroke-width="1.5"/>
  <path d="M15 29V18c0-6 4-10 9-10s9 4 9 10v11l4 5H11l4-5Z" fill="url(#bell-shell)" stroke="var(--pack-edge,#5F584A)" stroke-width="1.5"/>
  <path d="M18 17c-1 4-1 9 0 13" stroke="var(--pack-reflection,#E3DDC9)" stroke-width="1.5" opacity=".62"/>
  <path d="M11 34h26l-2 4H13Z" fill="url(#bell-rim)" stroke="var(--pack-edge,#5F584A)" stroke-width="1.5"/>
  <path d="M21 38h6l-1 4c0 2-1 3-2 3s-2-1-2-3Z" fill="var(--pack-clapper,#62584A)" stroke="var(--pack-edge,#4E493F)" stroke-width="1.5"/>
  <path d="M15 30c5 1 13 1 18 0" stroke="var(--pack-bell-band,#827352)" stroke-width="1.5"/>

  </g>
</svg>
