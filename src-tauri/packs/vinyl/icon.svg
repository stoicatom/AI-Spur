<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <title>黑胶唱机</title>
  <defs>
    <linearGradient id="vinyl-plinth" x1="7" y1="10" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--pack-plinth-light,#6D6D68)"/>
      <stop offset=".48" stop-color="var(--pack-plinth,#454A4A)"/>
      <stop offset="1" stop-color="var(--pack-plinth-shadow,#2D3435)"/>
    </linearGradient>
    <radialGradient id="vinyl-disc" cx="0" cy="0" r="1" gradientTransform="translate(18 23) rotate(46) scale(16)">
      <stop stop-color="var(--pack-disc-light,#62676A)"/>
      <stop offset=".48" stop-color="var(--pack-disc,#303739)"/>
      <stop offset="1" stop-color="var(--pack-disc-shadow,#1E282A)"/>
    </radialGradient>
    <filter id="studio-light" x="-28%" y="-24%" width="156%" height="168%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.15" result="shadow-blur"/>
      <feOffset in="shadow-blur" dy="1.65" result="shadow-offset"/>
      <feFlood flood-color="#02070A" flood-opacity=".52" result="shadow-color"/>
      <feComposite in="shadow-color" in2="shadow-offset" operator="in" result="shadow"/>
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="49" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values=".12 0 0 0 .44  0 .12 0 0 .46  0 0 .12 0 .48  0 0 0 .14 0" result="micro-texture"/>
      <feComposite in="micro-texture" in2="SourceAlpha" operator="in" result="surface"/>
      <feSpecularLighting in="SourceAlpha" surfaceScale="2.2" specularConstant=".42" specularExponent="26" lighting-color="#FFFFFF" result="specular">
        <feDistantLight azimuth="224" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="highlight"/>
      <feBlend in="SourceGraphic" in2="surface" mode="soft-light" result="textured"/>
      <feBlend in="textured" in2="highlight" mode="screen" result="lit"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="lit"/></feMerge>
    </filter>
    <filter id="contact-shadow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="1.45"/>
    </filter>
  </defs>
  <ellipse cx="24" cy="42.25" rx="12.5" ry="1.35" fill="#02070A" opacity=".38" filter="url(#contact-shadow)"/>
  <g filter="url(#studio-light)">
  <path d="M6 11h34l3 4v23H6Z" fill="url(#vinyl-plinth)" stroke="var(--pack-edge,#343C3D)" stroke-width="1.5"/>
  <path d="M6 11h34l3 4H10Z" fill="var(--pack-plinth-edge,#8A8A80)" stroke="var(--pack-edge,#343C3D)" stroke-width="1.5"/>
  <circle cx="20" cy="25" r="14" fill="url(#vinyl-disc)" stroke="var(--pack-edge,#343C3D)" stroke-width="1.5"/>
  <circle cx="20" cy="25" r="10" stroke="var(--pack-groove,#737B7A)" stroke-width="1.5" opacity=".56"/>
  <circle cx="20" cy="25" r="6" stroke="var(--pack-groove,#737B7A)" stroke-width="1.5" opacity=".5"/>
  <circle cx="20" cy="25" r="4" fill="var(--pack-label,#8A7861)" stroke="var(--pack-edge,#343C3D)" stroke-width="1.5"/>
  <circle cx="20" cy="25" r="1.25" fill="var(--pack-spindle,#D1CEBE)"/>
  <path d="M37 15v9l-7 8-3-2 7-8v-7Z" fill="var(--pack-arm,#B5B2A2)" stroke="var(--pack-edge,#343C3D)" stroke-width="1.5"/>
  <path d="M27 30 31 33l-2 3-4-2Z" fill="var(--pack-cartridge,#4E5656)" stroke="var(--pack-edge,#343C3D)" stroke-width="1.5"/>
  <path d="M9 38v4m29-4v4M35 17h3" stroke="var(--pack-hardware,#B7B7AC)" stroke-width="1.5"/>

  </g>
</svg>
