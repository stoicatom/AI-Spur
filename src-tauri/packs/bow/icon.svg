<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <title>木质长弓</title>
  <defs>
    <linearGradient id="bow-laminate" x1="10" y1="5" x2="20" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--pack-wood-light,#C39467)"/>
      <stop offset=".48" stop-color="var(--pack-wood,#805239)"/>
      <stop offset="1" stop-color="var(--pack-wood-shadow,#442E27)"/>
    </linearGradient>
    <linearGradient id="bow-arrowhead" x1="36" y1="19" x2="44" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--pack-steel-light,#E2E7E5)"/>
      <stop offset="1" stop-color="var(--pack-steel,#758286)"/>
    </linearGradient>
    <filter id="studio-light" x="-28%" y="-24%" width="156%" height="168%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.15" result="shadow-blur"/>
      <feOffset in="shadow-blur" dy="1.65" result="shadow-offset"/>
      <feFlood flood-color="#02070A" flood-opacity=".52" result="shadow-color"/>
      <feComposite in="shadow-color" in2="shadow-offset" operator="in" result="shadow"/>
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="16" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values=".12 0 0 0 .44  0 .12 0 0 .46  0 0 .12 0 .48  0 0 0 .14 0" result="micro-texture"/>
      <feComposite in="micro-texture" in2="SourceAlpha" operator="in" result="surface"/>
      <feSpecularLighting in="SourceAlpha" surfaceScale="2.2" specularConstant=".42" specularExponent="26" lighting-color="#FFFFFF" result="specular">
        <feDistantLight azimuth="224" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="highlight"/>
      <feBlend in="SourceGraphic" in2="surface" mode="soft-light" result="textured"/>
      <feBlend in="textured" in2="highlight" mode="screen" result="lit"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="lit"/></feMerge>
    </filter>
    <filter id="contact-shadow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="1.45"/>
    </filter>
  </defs>
  <ellipse cx="24" cy="42.25" rx="12.5" ry="1.35" fill="#02070A" opacity=".38" filter="url(#contact-shadow)"/>
  <g filter="url(#studio-light)">
  <path d="M12 4c12 8 15 25 0 40l4-1c13-12 13-27 0-38Z" fill="url(#bow-laminate)" stroke="var(--pack-ink,#3E332D)" stroke-width="1.5"/>
  <path d="M12 5 5 24l7 19" stroke="var(--pack-string,#D6D1C4)" stroke-width="1.5"/>
  <path d="M5 23h34v2H5Z" fill="var(--pack-shaft,#806246)" stroke="var(--pack-ink,#3E332D)" stroke-width="1.5"/>
  <path d="m43 24-7-5v10Z" fill="url(#bow-arrowhead)" stroke="var(--pack-ink,#3E332D)" stroke-width="1.5"/>
  <path d="m10 23-6-5 2 5Zm0 2-6 5 2-5Z" fill="var(--pack-feather,#C8D4D0)" stroke="var(--pack-ink,#3E332D)" stroke-width="1.5"/>
  <path d="M13 9c7 8 9 16 6 25M18 22h16" stroke="var(--pack-wood-grain,#D0A172)" stroke-width="1.5" opacity=".62"/>

  </g>
</svg>
