<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <title>弹孔碎屏</title>
  <defs>
    <linearGradient id="glass-pane" x1="7" y1="6" x2="41" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--pack-glass-light,#E5EFF0)" stop-opacity=".9"/>
      <stop offset=".48" stop-color="var(--pack-glass,#A6BDC1)" stop-opacity=".7"/>
      <stop offset="1" stop-color="var(--pack-glass-shadow,#697D84)" stop-opacity=".82"/>
    </linearGradient>
    <radialGradient id="glass-impact" cx="0" cy="0" r="1" gradientTransform="translate(25 23) rotate(90) scale(6)">
      <stop stop-color="var(--pack-impact-core,#3D4850)"/>
      <stop offset=".55" stop-color="var(--pack-impact-edge,#7C8F94)"/>
      <stop offset="1" stop-color="var(--pack-impact-light,#D8E4E3)"/>
    </radialGradient>
    <filter id="studio-light" x="-28%" y="-24%" width="156%" height="168%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.15" result="shadow-blur"/>
      <feOffset in="shadow-blur" dy="1.65" result="shadow-offset"/>
      <feFlood flood-color="#02070A" flood-opacity=".52" result="shadow-color"/>
      <feComposite in="shadow-color" in2="shadow-offset" operator="in" result="shadow"/>
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="26" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values=".12 0 0 0 .44  0 .12 0 0 .46  0 0 .12 0 .48  0 0 0 .14 0" result="micro-texture"/>
      <feComposite in="micro-texture" in2="SourceAlpha" operator="in" result="surface"/>
      <feSpecularLighting in="SourceAlpha" surfaceScale="2.2" specularConstant=".42" specularExponent="26" lighting-color="#FFFFFF" result="specular">
        <feDistantLight azimuth="224" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="highlight"/>
      <feBlend in="SourceGraphic" in2="surface" mode="soft-light" result="textured"/>
      <feBlend in="textured" in2="highlight" mode="screen" result="lit"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="lit"/></feMerge>
    </filter>
    <filter id="contact-shadow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="1.45"/>
    </filter>
  </defs>
  <ellipse cx="24" cy="42.25" rx="12.5" ry="1.35" fill="#02070A" opacity=".38" filter="url(#contact-shadow)"/>
  <g filter="url(#studio-light)">
  <path d="M6 6h36v36H6Z" fill="url(#glass-pane)" stroke="var(--pack-frame,#52666C)" stroke-width="1.5"/>
  <path d="M8 8h18L8 26Zm32 32H22l18-17Z" fill="var(--pack-reflection,#F4FAF8)" opacity=".3"/>
  <circle cx="25" cy="23" r="5" fill="url(#glass-impact)" stroke="var(--pack-frame,#52666C)" stroke-width="1.5"/>
  <circle cx="25" cy="23" r="1.5" fill="var(--pack-impact-core,#303A41)"/>
  <path d="m22 20-7-8-1 6-6 2m20 0 7-8 1 7 6 3M29 25l10 4-6 3 2 8m-13-13-7 12-2-7-6 2m18-7-2 7m-3-15 1-6" stroke="var(--pack-fracture,#607B83)" stroke-width="1.5"/>
  <path d="M9 10h10" stroke="var(--pack-glint,#FFFFFF)" stroke-width="1.5" opacity=".72"/>

  </g>
</svg>
