<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <title>左轮手枪</title>
  <defs>
    <linearGradient id="revolver-metal" x1="9" y1="13" x2="43" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--pack-metal-light,#C7D0D0)"/>
      <stop offset=".45" stop-color="var(--pack-metal,#778386)"/>
      <stop offset="1" stop-color="var(--pack-metal-shadow,#3B494C)"/>
    </linearGradient>
    <linearGradient id="revolver-grip" x1="15" y1="29" x2="23" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--pack-wood-light,#946C50)"/>
      <stop offset="1" stop-color="var(--pack-wood-shadow,#49352D)"/>
    </linearGradient>
    <filter id="studio-light" x="-28%" y="-24%" width="156%" height="168%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.15" result="shadow-blur"/>
      <feOffset in="shadow-blur" dy="1.65" result="shadow-offset"/>
      <feFlood flood-color="#02070A" flood-opacity=".52" result="shadow-color"/>
      <feComposite in="shadow-color" in2="shadow-offset" operator="in" result="shadow"/>
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="38" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values=".12 0 0 0 .44  0 .12 0 0 .46  0 0 .12 0 .48  0 0 0 .14 0" result="micro-texture"/>
      <feComposite in="micro-texture" in2="SourceAlpha" operator="in" result="surface"/>
      <feSpecularLighting in="SourceAlpha" surfaceScale="2.2" specularConstant=".42" specularExponent="26" lighting-color="#FFFFFF" result="specular">
        <feDistantLight azimuth="224" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="highlight"/>
      <feBlend in="SourceGraphic" in2="surface" mode="soft-light" result="textured"/>
      <feBlend in="textured" in2="highlight" mode="screen" result="lit"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="lit"/></feMerge>
    </filter>
    <filter id="contact-shadow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="1.45"/>
    </filter>
  </defs>
  <ellipse cx="24" cy="42.25" rx="12.5" ry="1.35" fill="#02070A" opacity=".38" filter="url(#contact-shadow)"/>
  <g filter="url(#studio-light)">
  <path d="M21 14h24v7H28l-3 7H12c-4-2-6-6-5-10l5-1 2-4Z" fill="url(#revolver-metal)" stroke="var(--pack-ink,#2D3A3C)" stroke-width="1.5"/>
  <path d="M15 28h11l-2 15H13c-2-5-2-9 2-15Z" fill="url(#revolver-grip)" stroke="var(--pack-ink,#2D3A3C)" stroke-width="1.5"/>
  <circle cx="20" cy="22" r="7" fill="var(--pack-cylinder,#5A696C)" stroke="var(--pack-ink,#2D3A3C)" stroke-width="1.5"/>
  <circle cx="20" cy="22" r="2" fill="var(--pack-brass,#A88956)"/>
  <path d="m20 15 2 4m5 1-4 2m-3 7v-4m-7-5 4 2" stroke="var(--pack-cylinder-edge,#A5B1B0)" stroke-width="1.5"/>
  <path d="M26 29c4 0 5 3 3 6h-5m-11-19-2-4h7l3 3m15-1 3-4 4 4" stroke="var(--pack-ink,#2D3A3C)" stroke-width="1.5"/>
  <path d="M28 17h14M16 31l7 9" stroke="var(--pack-metal-sheen,#E4E9E5)" stroke-width="1.5" opacity=".55"/>

  </g>
</svg>
